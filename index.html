<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>vomit.gmc · анонимный имиджборд</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: system-ui, 'Segoe UI', Roboto, sans-serif; }
    body { background: #1e1f22; color: #e3e5e8; display: flex; justify-content: center; padding: 2rem 1rem; min-height: 100vh; }
    .board { max-width: 1000px; width: 100%; background: #2b2d31; border-radius: 28px; box-shadow: 0 20px 40px rgba(0,0,0,0.6); padding: 2rem 1.5rem; border: 1px solid #3c3f45; }
    .board-header { display: flex; align-items: center; gap: 1rem; margin-bottom: 1.8rem; border-bottom: 2px solid #3c3f45; padding-bottom: 1rem; }
    .board-header h1 { font-size: 1.9rem; font-weight: 600; color: #f2f3f5; }
    .board-header .badge { background: #4e5058; color: #b5bac1; font-size: 0.85rem; padding: 0.2rem 0.8rem; border-radius: 20px; }
    .new-post-form { background: #313338; border-radius: 20px; padding: 1.5rem; margin-bottom: 2rem; border: 1px solid #404249; }
    .form-row { display: flex; flex-wrap: wrap; gap: 1rem; margin-bottom: 1rem; }
    .form-row input, .form-row textarea { background: #1e1f22; border: 1px solid #4e5058; color: #e3e5e8; padding: 0.8rem 1rem; border-radius: 12px; font-size: 0.95rem; outline: none; }
    .form-row input:focus, .form-row textarea:focus { border-color: #5865f2; box-shadow: 0 0 0 3px rgba(88,101,242,0.3); }
    .form-row input { flex: 1 1 150px; }
    .form-row textarea { flex: 2 1 300px; resize: vertical; min-height: 90px; }
    .form-actions { display: flex; justify-content: flex-end; gap: 0.8rem; }
    .btn { background: #4e5058; border: none; color: #f2f3f5; font-weight: 500; padding: 0.8rem 1.8rem; border-radius: 40px; cursor: pointer; font-size: 0.95rem; transition: 0.2s; }
    .btn:hover { background: #5d6069; }
    .btn-primary { background: #5865f2; color: white; }
    .btn-primary:hover { background: #4752c4; }
    .btn-outline { background: transparent; border: 1px solid #4e5058; }
    .board-toolbar { display: flex; justify-content: space-between; margin-bottom: 1.5rem; color: #b5bac1; font-size: 0.9rem; }
    .post-count { background: #1e1f22; padding: 0.3rem 1rem; border-radius: 30px; }
    .posts-feed { display: flex; flex-direction: column; gap: 1.2rem; }
    .post-card { background: #313338; border-radius: 20px; padding: 1.2rem 1.5rem; border: 1px solid #3c3f45; animation: fadeIn 0.3s ease; }
    .post-header { display: flex; align-items: center; flex-wrap: wrap; gap: 0.8rem 1.2rem; margin-bottom: 0.8rem; font-size: 0.85rem; color: #b5bac1; }
    .post-author { display: flex; align-items: center; gap: 0.4rem; background: #1e1f22; padding: 0.2rem 0.8rem; border-radius: 30px; font-weight: 500; color: #dbdee1; }
    .post-date { background: #1e1f22; padding: 0.2rem 0.8rem; border-radius: 30px; }
    .post-id { background: #1e1f22; padding: 0.2rem 0.8rem; border-radius: 30px; font-family: monospace; color: #a6a8ad; }
    .post-text { font-size: 1rem; line-height: 1.55; white-space: pre-wrap; word-break: break-word; margin: 0.5rem 0; color: #e3e5e8; }
    .empty-feed { text-align: center; padding: 3rem; background: #2b2d31; border-radius: 20px; border: 1px dashed #4e5058; color: #7e8288; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(-5px); } to { opacity: 1; transform: translateY(0); } }
    .error-msg { color: #ed4245; text-align: center; padding: 1rem; background: rgba(237, 66, 69, 0.1); border-radius: 12px; margin-top: 1rem; font-size: 0.9rem; }
  </style>
</head>
<body>
  <div class="board">
    <header class="board-header">
      <h1>🤢 vomit.gmc</h1>
      <span class="badge">анонимный имиджборд</span>
    </header>

    <section class="new-post-form">
      <form id="postForm">
        <div class="form-row">
          <input type="text" id="authorInput" placeholder="Аноним (или ваш ник)" maxlength="30" autocomplete="off">
          <textarea id="textInput" placeholder="Введите сообщение..." required></textarea>
        </div>
        <div class="form-actions">
          <button type="button" class="btn btn-outline" id="clearBtn">Очистить</button>
          <button type="submit" class="btn btn-primary" id="submitBtn">Отправить</button>
        </div>
      </form>
      <div id="errorBox"></div>
    </section>

    <div class="board-toolbar">
      <span class="post-count" id="postCount">Загрузка...</span>
      <span>🕒 Новые сверху</span>
    </div>

    <main class="posts-feed" id="postsFeed"></main>
  </div>

  <!-- Подключаем библиотеку Supabase (v2) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <script>
    // =========================================================
    // ⚠️ ВСТАВЬ СЮДА СВОИ КЛЮЧИ ИЗ SUPABASE (Project Settings -> API)
    // =========================================================
    const SUPABASE_URL = 'https://ixeckrmjwfaghcrmiep.supabase.co'; // Твой URL
    const SUPABASE_ANON_KEY = 'sb_publishable_1gEN4w23ZxnYOosQ92_zGw_5oFocx6z'; // Publishable key или anon public
    // =========================================================

    // Инициализация клиента. Называем его client, чтобы не конфликтовать с window.supabase
    const client = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // DOM элементы
    const feedEl = document.getElementById('postsFeed');
    const postCountEl = document.getElementById('postCount');
    const postForm = document.getElementById('postForm');
    const authorInput = document.getElementById('authorInput');
    const textInput = document.getElementById('textInput');
    const submitBtn = document.getElementById('submitBtn');
    const errorBox = document.getElementById('errorBox');

    // Функция для защиты от XSS (экранирование HTML)
    function escapeHTML(str) {
      if (!str) return '';
      return str.replace(/[&<>'"]/g, 
        tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag])
      );
    }

    // Форматирование времени
    function formatDate(timestamp) {
      const d = new Date(timestamp);
      const now = new Date();
      const diffMin = Math.floor((now - d) / 60000);
      if (diffMin < 1) return 'только что';
      if (diffMin < 60) return `${diffMin} мин. назад`;
      if (diffMin < 1440) return `${Math.floor(diffMin / 60)} ч. назад`;
      return d.toLocaleDateString('ru-RU');
    }

    // Отрисовка постов на странице
    function renderPosts(posts) {
      if (!posts || posts.length === 0) {
        feedEl.innerHTML = `<div class="empty-feed">✨ Пока нет ни одного поста. Будьте первым!</div>`;
        postCountEl.textContent = `0 постов`;
        return;
      }

      const count = posts.length;
      postCountEl.textContent = `${count} ${count === 1 ? 'пост' : (count < 5 ? 'поста' : 'постов')}`;

      feedEl.innerHTML = posts.map(post => `
        <article class="post-card">
          <div class="post-header">
            <span class="post-author">👤 ${escapeHTML(post.author || 'Аноним')}</span>
            <span class="post-date">🕒 ${formatDate(post.created_at)}</span>
            <span class="post-id">#${post.id}</span>
          </div>
          <div class="post-text">${escapeHTML(post.text).replace(/\n/g, '<br>')}</div>
        </article>
      `).join('');
    }

    // Загрузка данных из БД
    async function loadPosts() {
      try {
        // AbortSignal.timeout(10000) — если за 10 сек не ответит, выдаст ошибку
        const { data, error } = await client
          .from('posts')
          .select('*')
          .order('created_at', { ascending: false })
          .abortSignal(AbortSignal.timeout(10000));

        if (error) throw error;
        
        renderPosts(data);
      } catch (err) {
        console.error('Ошибка загрузки:', err);
        feedEl.innerHTML = `<div class="empty-feed">Не удалось загрузить посты. Проверь соединение.</div>`;
        postCountEl.textContent = 'Ошибка';
        errorBox.innerHTML = `<div class="error-msg">Ошибка: ${escapeHTML(err.message)}</div>`;
      }
    }

    // Подписка на новые посты (Realtime)
    function subscribeToRealtime() {
      client
        .channel('public:posts')
        .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'posts' }, payload => {
          console.log('Прилетел новый пост:', payload.new);
          // Перезагружаем ленту, чтобы новый пост встал на свое место (сверху)
          loadPosts(); 
        })
        .subscribe();
    }

    // Отправка формы
    postForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorBox.innerHTML = ''; // Очищаем старые ошибки
      
      const author = authorInput.value.trim() || 'Аноним';
      const text = textInput.value.trim();

      if (!text) return;

      // Блокируем кнопку, чтобы не спамили
      submitBtn.disabled = true;
      submitBtn.textContent = 'Отправка...';

      try {
        const { error } = await client
          .from('posts')
          .insert([{ author: author, text: text }]);

        if (error) throw error;

        // Очищаем поля после успешной отправки
        textInput.value = '';
        authorInput.value = '';
        
        // Подписка Realtime сама обновит ленту, но на всякий случай вызовем loadPosts
        loadPosts(); 
      } catch (err) {
        console.error('Ошибка отправки:', err);
        errorBox.innerHTML = `<div class="error-msg">Не удалось отправить: ${escapeHTML(err.message)}</div>`;
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Отправить';
      }
    });

    // Кнопка "Очистить"
    document.getElementById('clearBtn').addEventListener('click', () => {
      textInput.value = '';
      authorInput.value = '';
      errorBox.innerHTML = '';
    });

    // ЗАПУСК ПРИ ЗАГРУЗКЕ СТРАНИЦЫ
    loadPosts();
    subscribeToRealtime();
  </script>
</body>
</html>
