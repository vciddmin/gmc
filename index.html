<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>vomit.gmc · #cryghanistan</title>
  <link rel="icon" type="image/x-icon" href="sigil.ico">
  <style>
    :root {
      --bg-body: #1a1b1e; --bg-board: #232428; --bg-sidebar: #1e1f22;
      --bg-card: #2b2d31; --bg-input: #1e1f22; --text-main: #e3e5e8;
      --text-muted: #949ba4; --accent: #5865f2; --border-color: #313338;
      --radius: 16px; --font-main: system-ui, 'Segoe UI', Roboto, sans-serif;
      --board-opacity: 0.95; 
    }
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: var(--font-main); }
    body { 
      background-color: var(--bg-body); color: var(--text-main); 
      display: flex; justify-content: center; min-height: 100vh; 
      transition: background 0.3s, color 0.3s; 
      background-size: cover; background-position: center; background-attachment: fixed;
    }
    body::before { content: ''; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.6); z-index: -1; backdrop-filter: blur(3px); }
    .app-container { display: flex; width: 100%; max-width: 1200px; background: var(--bg-board); box-shadow: 0 10px 30px rgba(0,0,0,0.5); transition: background 0.3s, opacity 0.3s; z-index: 1; opacity: var(--board-opacity); position: relative; background-size: cover; background-position: center; background-repeat: no-repeat; }
    .app-container::before { content: ''; position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.4); z-index: -1; border-radius: inherit; pointer-events: none; }
    .sidebar, .main-content { position: relative; z-index: 2; }
    
    .sidebar { width: 240px; background: var(--bg-sidebar); padding: 2rem 1rem; border-right: 1px solid var(--border-color); display: flex; flex-direction: column; gap: 0.5rem; flex-shrink: 0; }
    .sidebar-logo { font-size: 1.4rem; font-weight: 700; color: #f2f3f5; margin-bottom: 1.5rem; padding-left: 0.5rem; }
    .board-list { display: flex; flex-direction: column; gap: 0.3rem; overflow-y: auto; max-height: 60vh; }
    .board-btn { background: transparent; border: none; color: var(--text-muted); font-size: 0.95rem; font-weight: 500; text-align: left; padding: 0.7rem 1rem; border-radius: 10px; cursor: pointer; transition: 0.2s; display: flex; align-items: center; gap: 10px; }
    .board-btn:hover { background: var(--bg-card); color: var(--text-main); }
    .board-btn.active { background: var(--accent); color: white; }
    .add-board-btn { margin-top: 1rem; background: var(--bg-card); border: 1px dashed var(--border-color); padding: 0.8rem; border-radius: 10px; color: var(--text-main); cursor: pointer; text-align: center; font-size: 0.9rem; }
    .add-board-btn:hover { border-color: var(--accent); }

    .main-content { flex: 1; padding: 2rem; display: flex; flex-direction: column; max-height: 100vh; overflow-y: auto; }
    .header { border-bottom: 2px solid var(--border-color); padding-bottom: 1rem; margin-bottom: 1.5rem; }
    .header-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; }
    .header-top h1 { font-size: 1.6rem; font-weight: 600; }
    
    .toolbar { display: flex; gap: 1rem; flex-wrap: wrap; }
    .search-input { flex: 1; min-width: 200px; background: var(--bg-input); border: 1px solid var(--border-color); color: var(--text-main); padding: 0.6rem 1rem; border-radius: 8px; outline: none; }
    .search-input:focus { border-color: var(--accent); }
    .sort-select { background: var(--bg-input); border: 1px solid var(--border-color); color: var(--text-main); padding: 0.6rem 1rem; border-radius: 8px; outline: none; cursor: pointer; }

    .new-post-form { background: var(--bg-card); border-radius: var(--radius); padding: 1.2rem; margin-bottom: 2rem; border: 1px solid var(--border-color); }
    .form-row { display: flex; flex-direction: column; gap: 0.8rem; margin-bottom: 1rem; }
    .form-row input, .form-row textarea { background: var(--bg-input); border: 1px solid var(--border-color); color: var(--text-main); padding: 0.8rem; border-radius: 10px; outline: none; }
    .form-row textarea { resize: vertical; min-height: 60px; }
    
    .form-actions { display: flex; justify-content: space-between; align-items: center; gap: 0.5rem; }
    .file-label { display: flex; align-items: center; gap: 5px; cursor: pointer; color: var(--text-muted); font-size: 0.9rem; padding: 0.5rem; border-radius: 8px; transition: 0.2s; }
    .file-label:hover { background: var(--bg-input); color: var(--text-main); }
    .file-input { display: none; }
    
    .btn { border: none; color: white; font-weight: 500; padding: 0.6rem 1.2rem; border-radius: 8px; cursor: pointer; transition: 0.2s; }
    .btn-primary { background: var(--accent); }
    .btn-primary:hover { filter: brightness(0.9); }
    .btn-outline { background: transparent; border: 1px solid var(--border-color); color: var(--text-main); }

    .posts-feed { display: flex; flex-direction: column; gap: 1rem; }
    .post-node { display: flex; flex-direction: column; gap: 0.5rem; }
    .post-card { background: var(--bg-card); border-radius: var(--radius); padding: 1rem; border: 1px solid var(--border-color); }
    .post-header { display: flex; align-items: center; gap: 0.8rem; margin-bottom: 0.5rem; font-size: 0.8rem; color: var(--text-muted); }
    .post-author { background: var(--bg-input); padding: 0.2rem 0.6rem; border-radius: 20px; font-weight: 600; color: var(--text-main); }
    .post-date { margin-left: auto; }
    .post-text { font-size: 0.95rem; line-height: 1.4; white-space: pre-wrap; word-break: break-word; margin-bottom: 0.5rem; }
    
    /* Стили для картинок в постах */
    .post-image { max-width: 100%; max-height: 400px; border-radius: 8px; margin-top: 0.5rem; display: block; object-fit: contain; }
    
    .post-actions { display: flex; align-items: center; gap: 1rem; font-size: 0.85rem; color: var(--text-muted); }
    .reply-btn { cursor: pointer; color: var(--accent); font-weight: 500; background: none; border: none; padding: 0; font-size: 0.85rem; }
    .reply-btn:hover { text-decoration: underline; }
    
    .reactions { display: flex; gap: 0.5rem; margin-left: auto; }
    .reaction-btn { background: var(--bg-input); border: 1px solid var(--border-color); color: var(--text-main); padding: 0.2rem 0.6rem; border-radius: 20px; cursor: pointer; display: flex; align-items: center; gap: 5px; font-size: 0.85rem; transition: 0.2s; }
    .reaction-btn:hover { border-color: var(--accent); }
    .reaction-btn.liked { background: rgba(88, 101, 242, 0.2); border-color: var(--accent); color: var(--accent); }

    .children-container { margin-left: 1.5rem; padding-left: 1rem; border-left: 2px solid var(--border-color); display: flex; flex-direction: column; gap: 0.8rem; margin-top: 0.5rem; }

    .reply-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 2000; justify-content: center; align-items: center; }
    .reply-modal.open { display: flex; }
    .modal-content { background: var(--bg-card); padding: 1.5rem; border-radius: var(--radius); width: 100%; max-width: 500px; border: 1px solid var(--border-color); }
    .modal-content h3 { margin-bottom: 1rem; font-size: 1.1rem; }
    .modal-textarea { width: 100%; background: var(--bg-input); border: 1px solid var(--border-color); color: var(--text-main); padding: 0.8rem; border-radius: 10px; min-height: 80px; margin-bottom: 1rem; resize: vertical; }

    .settings-toggle { position: fixed; bottom: 20px; right: 20px; width: 50px; height: 50px; border-radius: 50%; background: var(--accent); color: white; border: none; font-size: 1.5rem; cursor: pointer; box-shadow: 0 4px 15px rgba(0,0,0,0.4); z-index: 1000; display: flex; align-items: center; justify-content: center; }
    .settings-panel { position: fixed; top: 0; right: -350px; width: 320px; height: 100vh; background: var(--bg-sidebar); border-left: 1px solid var(--border-color); padding: 2rem 1.5rem; box-shadow: -5px 0 20px rgba(0,0,0,0.5); z-index: 1001; transition: right 0.3s; overflow-y: auto; }
    .settings-panel.open { right: 0; }
    
    .settings-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; }
    .settings-header h2 { font-size: 1.3rem; color: var(--text-main); margin: 0; }
    .close-settings { background: none; border: none; color: var(--text-muted); font-size: 1.5rem; cursor: pointer; transition: color 0.2s; }
    .close-settings:hover { color: #ed4245; }

    .setting-group { margin-bottom: 1.2rem; }
    .setting-group label { display: block; font-size: 0.85rem; color: var(--text-muted); margin-bottom: 0.3rem; }
    .setting-group input[type="color"], .setting-group input[type="file"], .setting-group input[type="range"], .setting-group select { width: 100%; padding: 0.4rem; background: var(--bg-input); border: 1px solid var(--border-color); color: var(--text-main); border-radius: 8px; }
    .setting-group input[type="color"] { height: 35px; cursor: pointer; }
    .setting-group input[type="file"] { font-size: 0.8rem; cursor: pointer; }

    @media (max-width: 768px) {
      .app-container { flex-direction: column; }
      .sidebar { width: 100%; flex-direction: row; overflow-x: auto; padding: 1rem; border-right: none; border-bottom: 1px solid var(--border-color); align-items: center; }
      .sidebar-logo { margin-bottom: 0; margin-right: 1rem; font-size: 1.2rem; }
      .board-list { flex-direction: row; max-height: none; overflow: visible; }
      .board-btn { white-space: nowrap; padding: 0.5rem 1rem; }
      .add-board-btn { margin-top: 0; margin-left: 0.5rem; white-space: nowrap; }
      .main-content { padding: 1rem; }
      .toolbar { flex-direction: column; }
    }
  </style>
</head>
<body>
  <div class="app-container" id="appContainer">
    <aside class="sidebar">
      <div class="sidebar-logo"><span>🤢</span>vomit.gmc</div>
      <div class="board-list" id="boardList"></div>
      <button class="add-board-btn" id="addBoardBtn">+ Создать ветку</button>
    </aside>

    <main class="main-content">
      <header class="header">
        <div class="header-top">
          <h1 id="boardTitle">Загрузка...</h1>
          <span id="postCount" style="color: var(--text-muted); font-size: 0.9rem;"></span>
        </div>
        <div class="toolbar">
          <input type="text" id="searchInput" class="search-input" placeholder="🔍 Поиск по сообщениям...">
          <select id="sortSelect" class="sort-select">
            <option value="newest">🕒 Сначала новые</option>
            <option value="popular">🔥 Самые популярные</option>
            <option value="liked">❤️ Самые залайканные</option>
          </select>
        </div>
      </header>

      <section class="new-post-form" id="newPostSection">
        <form id="postForm">
          <div class="form-row">
            <input type="text" id="authorInput" placeholder="Аноним (или ваш ник)" maxlength="30" autocomplete="off">
            <textarea id="textInput" placeholder="Введите сообщение в эту ветку..." required></textarea>
          </div>
          <div class="form-actions">
            <label class="file-label" id="fileLabel">
              📎 Прикрепить файл
              <input type="file" id="fileInput" class="file-input" accept="image/*,image/gif">
            </label>
            <div style="display: flex; gap: 0.5rem;">
              <button type="button" class="btn btn-outline" id="clearBtn">Очистить</button>
              <button type="submit" class="btn btn-primary" id="submitBtn">Отправить</button>
            </div>
          </div>
        </form>
        <div id="errorBox"></div>
      </section>

      <main class="posts-feed" id="postsFeed"></main>
    </main>
  </div>

  <div class="reply-modal" id="replyModal">
    <div class="modal-content">
      <h3>Ответ на пост</h3>
      <textarea class="modal-textarea" id="replyText" placeholder="Ваш ответ..."></textarea>
      <div style="display: flex; justify-content: flex-end; gap: 0.5rem;">
        <button class="btn btn-outline" id="cancelReply">Отмена</button>
        <button class="btn btn-primary" id="submitReply">Ответить</button>
      </div>
    </div>
  </div>

  <button class="settings-toggle" id="settingsToggle">⚙️</button>
  <div class="settings-panel" id="settingsPanel">
    <div class="settings-header">
      <h2>Настройки дизайна</h2>
      <button class="close-settings" id="closeSettings">×</button>
    </div>
    <div class="setting-group">
      <label>Фон сайта (Картинка / Гифка)</label>
      <input type="file" id="bgImageInput" accept="image/*">
    </div>
    <div class="setting-group">
      <label>Фон самого борда</label>
      <input type="file" id="boardBgInput" accept="image/*">
    </div>
    <div class="setting-group">
      <label>Основной цвет</label>
      <input type="color" id="accentColor" value="#5865f2">
    </div>
    <div class="setting-group">
      <label>Фон карточек</label>
      <input type="color" id="bgCard" value="#2b2d31">
    </div>
    <div class="setting-group">
      <label>Цвет текста</label>
      <input type="color" id="textMain" value="#e3e5e8">
    </div>
    <div class="setting-group">
      <label>Скругление углов (px)</label>
      <input type="range" id="radiusRange" min="0" max="30" value="16">
    </div>
    <div class="setting-group">
      <label>Прозрачность борда</label>
      <input type="range" id="opacityRange" min="0.1" max="1" step="0.05" value="0.95">
    </div>
    <button class="btn btn-primary" style="width:100%; margin-top: 1rem;" id="resetSettings">Сбросить настройки</button>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = 'https://ixeckrmjjwfaghcrmiep.supabase.co'; 
    const SUPABASE_ANON_KEY = 'sb_publishable_1gEN4w23ZxnYOosQ92_zGw_5oFocx6z'; // <--- ЗАМЕНИ ЭТО
    const client = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let currentBoard = 'random';
    let allPosts = [];
    let allBoards = [];
    let replyToPostId = null;
    let currentSearch = '';
    let currentSort = 'newest';
    let pendingFile = null; // Файл для загрузки

    const boardListEl = document.getElementById('boardList');
    const feedEl = document.getElementById('postsFeed');
    const postCountEl = document.getElementById('postCount');
    const postForm = document.getElementById('postForm');
    const authorInput = document.getElementById('authorInput');
    const textInput = document.getElementById('textInput');
    const submitBtn = document.getElementById('submitBtn');
    const boardTitle = document.getElementById('boardTitle');
    const replyModal = document.getElementById('replyModal');
    const replyText = document.getElementById('replyText');
    const appContainer = document.getElementById('appContainer');
    const searchInput = document.getElementById('searchInput');
    const sortSelect = document.getElementById('sortSelect');
    const fileInput = document.getElementById('fileInput');
    const fileLabel = document.getElementById('fileLabel');

    function escapeHTML(str) {
      if (!str) return '';
      return str.replace(/[&<>'"]/g, tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag]));
    }

    function formatDate(timestamp) {
      const d = new Date(timestamp);
      const now = new Date();
      const diffMin = Math.floor((now - d) / 60000);
      if (diffMin < 1) return 'только что';
      if (diffMin < 60) return `${diffMin} мин. назад`;
      if (diffMin < 1440) return `${Math.floor(diffMin / 60)} ч. назад`;
      return d.toLocaleDateString('ru-RU');
    }

    // --- Хелпер для отрисовки текста с картинками ---
    function renderTextWithImages(text) {
        if (!text) return '';
        // Если текст содержит маркер картинки [img]URL[/img]
        const parts = text.split(/(\[img\].*?\[\/img\])/g);
        return parts.map(part => {
            const match = part.match(/\[img\](.*?)\[\/img\]/);
            if (match) {
                const url = match[1];
                return `<img src="${url}" class="post-image" alt="media" loading="lazy">`;
            } else {
                return escapeHTML(part).replace(/\n/g, '<br>');
            }
        }).join('');
    }

    async function loadBoards() {
      const { data, error } = await client.from('boards').select('*').order('id', { ascending: true });
      if (error) { console.error(error); return; }
      allBoards = data;
      renderBoards();
    }

    function renderBoards() {
      boardListEl.innerHTML = allBoards.map(b => `
        <button class="board-btn ${b.name === currentBoard ? 'active' : ''}" data-board="${b.name}">
          ${b.icon} /${b.name}/
        </button>
      `).join('');

      document.querySelectorAll('.board-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
          document.querySelectorAll('.board-btn').forEach(b => b.classList.remove('active'));
          e.target.classList.add('active');
          currentBoard = e.target.dataset.board;
          boardTitle.textContent = `/${currentBoard}/`;
          renderPosts();
        });
      });
    }

    document.getElementById('addBoardBtn').addEventListener('click', async () => {
      const name = prompt('Введите название новой ветки (на английском, без пробелов):');
      if (!name) return;
      const cleanName = name.trim().toLowerCase().replace(/[^a-z0-9]/g, '');
      if (!cleanName) return alert('Только буквы и цифры!');
      const icon = prompt('Введите эмодзи для ветки (например 🐱, 🚀, 🍕):') || '📁';
      const { error } = await client.from('boards').insert([{ name: cleanName, icon: icon }]);
      if (error) return alert('Ошибка: ' + error.message);
      await loadBoards();
      const newBtn = document.querySelector(`.board-btn[data-board="${cleanName}"]`);
      if (newBtn) newBtn.click();
    });

    function buildTree(posts) {
      const map = {};
      const roots = [];
      posts.forEach(p => { map[p.id] = { ...p, children: [] }; });
      posts.forEach(p => {
        if (p.parent_id && map[p.parent_id]) {
          map[p.parent_id].children.push(map[p.id]);
        } else {
          roots.push(map[p.id]);
        }
      });
      return roots;
    }

    function renderPosts() {
      let filtered = allPosts.filter(p => p.board === currentBoard);
      
      if (currentSearch) {
        filtered = filtered.filter(p => p.text.toLowerCase().includes(currentSearch) || p.author.toLowerCase().includes(currentSearch));
      }

      if (currentSort === 'popular') {
        filtered.sort((a, b) => (b.likes - b.dislikes) - (a.likes - a.dislikes));
      } else if (currentSort === 'liked') {
        filtered.sort((a, b) => b.likes - a.likes);
      } else {
        filtered.sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
      }

      const tree = buildTree(filtered);
      
      if (tree.length === 0) {
        feedEl.innerHTML = `<div class="empty-feed">✨ Ничего не найдено. Напиши первым!</div>`;
        postCountEl.textContent = `0 постов`;
        return;
      }

      postCountEl.textContent = `${filtered.length} ${filtered.length === 1 ? 'пост' : (filtered.length < 5 ? 'поста' : 'постов')}`;
      
      function renderNode(node) {
        const childrenHtml = node.children.length > 0 
          ? `<div class="children-container">${node.children.map(renderNode).join('')}</div>` 
          : '';
        
        const likedPosts = JSON.parse(localStorage.getItem('vomit_liked') || '[]');
        const dislikedPosts = JSON.parse(localStorage.getItem('vomit_disliked') || '[]');
        const isLiked = likedPosts.includes(node.id) ? 'liked' : '';
        const isDisliked = dislikedPosts.includes(node.id) ? 'liked' : '';

        return `
          <div class="post-node">
            <div class="post-card">
              <div class="post-header">
                <span class="post-author">👤 ${escapeHTML(node.author || 'Аноним')}</span>
                <span class="post-date">🕒 ${formatDate(node.created_at)}</span>
              </div>
              <div class="post-text">${renderTextWithImages(node.text)}</div>
              <div class="post-actions">
                <button class="reply-btn" data-id="${node.id}">↩ Ответить</button>
                <div class="reactions">
                  <button class="reaction-btn like-btn ${isLiked}" data-id="${node.id}" data-action="like">
                    👍 <span>${node.likes || 0}</span>
                  </button>
                  <button class="reaction-btn dislike-btn ${isDisliked}" data-id="${node.id}" data-action="dislike">
                    👎 <span>${node.dislikes || 0}</span>
                  </button>
                </div>
              </div>
            </div>
            ${childrenHtml}
          </div>
        `;
      }

      feedEl.innerHTML = tree.map(renderNode).join('');

      document.querySelectorAll('.reply-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
          replyToPostId = e.target.dataset.id;
          replyModal.classList.add('open');
          replyText.focus();
        });
      });

      document.querySelectorAll('.like-btn, .dislike-btn').forEach(btn => {
        btn.addEventListener('click', async (e) => {
          const id = parseInt(e.currentTarget.dataset.id);
          const action = e.currentTarget.dataset.action;
          const post = allPosts.find(p => p.id === id);
          if (!post) return;

          let liked = JSON.parse(localStorage.getItem('vomit_liked') || '[]');
          let disliked = JSON.parse(localStorage.getItem('vomit_disliked') || '[]');

          if (action === 'like') {
            if (liked.includes(id)) {
              liked = liked.filter(x => x !== id);
              await client.from('posts').update({ likes: Math.max(0, post.likes - 1) }).eq('id', id);
            } else {
              liked.push(id);
              if (disliked.includes(id)) {
                disliked = disliked.filter(x => x !== id);
                await client.from('posts').update({ dislikes: Math.max(0, post.dislikes - 1) }).eq('id', id);
              }
              await client.from('posts').update({ likes: post.likes + 1 }).eq('id', id);
            }
          } else {
            if (disliked.includes(id)) {
              disliked = disliked.filter(x => x !== id);
              await client.from('posts').update({ dislikes: Math.max(0, post.dislikes - 1) }).eq('id', id);
            } else {
              disliked.push(id);
              if (liked.includes(id)) {
                liked = liked.filter(x => x !== id);
                await client.from('posts').update({ likes: Math.max(0, post.likes - 1) }).eq('id', id);
              }
              await client.from('posts').update({ dislikes: post.dislikes + 1 }).eq('id', id);
            }
          }

          localStorage.setItem('vomit_liked', JSON.stringify(liked));
          localStorage.setItem('vomit_disliked', JSON.stringify(disliked));
        });
      });
    }

    async function loadPosts() {
      const { data, error } = await client.from('posts').select('*').order('created_at', { ascending: true });
      if (error) { console.error(error); return; }
      allPosts = data;
      renderPosts();
    }

    // --- Выбор файла ---
    fileInput.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (file) {
            pendingFile = file;
            fileLabel.innerHTML = `✅ ${file.name.length > 15 ? file.name.slice(0, 12) + '...' : file.name}`;
        }
    });

    // --- Отправка поста (с загрузкой файла) ---
    postForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const author = authorInput.value.trim() || 'Аноним';
      let text = textInput.value.trim();
      
      if (!text && !pendingFile) return;

      submitBtn.disabled = true;
      submitBtn.textContent = 'Отправка...';

      let mediaUrl = null;

      // Если есть файл, загружаем его в Supabase Storage
      if (pendingFile) {
          try {
              const fileExt = pendingFile.name.split('.').pop();
              const fileName = `${Date.now()}.${fileExt}`;
              const filePath = `uploads/${fileName}`;

              const { data, error } = await client.storage
                  .from('media')
                  .upload(filePath, pendingFile, { cacheControl: '3600', upsert: false });

              if (error) throw error;

              // Получаем публичную ссылку
              const { data: { publicUrl } } = client.storage.from('media').getPublicUrl(filePath);
              mediaUrl = publicUrl;
          } catch (err) {
              document.getElementById('errorBox').innerHTML = `<div class="error-msg">Ошибка загрузки: ${err.message}</div>`;
              submitBtn.disabled = false;
              submitBtn.textContent = 'Отправить';
              return;
          }
      }

      // Формируем текст с маркером картинки
      let finalText = text;
      if (mediaUrl) {
          finalText = (finalText ? finalText + '\n' : '') + `[img]${mediaUrl}[/img]`;
      }

      const { error } = await client.from('posts').insert([{ author, text: finalText, board: currentBoard, parent_id: null }]);
      
      if (error) {
        document.getElementById('errorBox').innerHTML = `<div class="error-msg">Ошибка: ${error.message}</div>`;
      } else {
        textInput.value = '';
        pendingFile = null;
        fileInput.value = '';
        fileLabel.innerHTML = '📎 Прикрепить файл';
      }
      submitBtn.disabled = false;
      submitBtn.textContent = 'Отправить';
    });

    document.getElementById('submitReply').addEventListener('click', async () => {
      const text = replyText.value.trim();
      if (!text || !replyToPostId) return;

      const { error } = await client.from('posts').insert([{ 
        author: 'Аноним', 
        text, 
        board: currentBoard, 
        parent_id: replyToPostId 
      }]);

      if (error) { alert(error.message); return; }
      
      replyModal.classList.remove('open');
      replyText.value = '';
      replyToPostId = null;
    });

    document.getElementById('cancelReply').addEventListener('click', () => {
      replyModal.classList.remove('open');
      replyToPostId = null;
    });

    function subscribeToRealtime() {
      client.channel('public:posts')
        .on('postgres_changes', { event: '*', schema: 'public', table: 'posts' }, payload => {
          if (payload.eventType === 'UPDATE') {
            const index = allPosts.findIndex(p => p.id === payload.new.id);
            if (index !== -1) allPosts[index] = payload.new;
            renderPosts();
          } else if (payload.eventType === 'INSERT') {
            allPosts.push(payload.new);
            renderPosts();
          }
        }).subscribe();
        
      client.channel('public:boards')
        .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'boards' }, payload => {
          allBoards.push(payload.new);
          renderBoards();
        }).subscribe();
    }

    const settingsToggle = document.getElementById('settingsToggle');
    const settingsPanel = document.getElementById('settingsPanel');
    const closeSettings = document.getElementById('closeSettings');
    const bgImageInput = document.getElementById('bgImageInput');
    const boardBgInput = document.getElementById('boardBgInput');
    const accentColor = document.getElementById('accentColor');
    const bgCard = document.getElementById('bgCard');
    const textMain = document.getElementById('textMain');
    const radiusRange = document.getElementById('radiusRange');
    const opacityRange = document.getElementById('opacityRange');

    settingsToggle.addEventListener('click', () => settingsPanel.classList.toggle('open'));
    closeSettings.addEventListener('click', () => settingsPanel.classList.remove('open'));

    searchInput.addEventListener('input', (e) => {
      currentSearch = e.target.value.toLowerCase();
      renderPosts();
    });
    sortSelect.addEventListener('change', (e) => {
      currentSort = e.target.value;
      renderPosts();
    });

    bgImageInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (event) => {
        const base64 = event.target.result;
        document.body.style.backgroundImage = `url(${base64})`;
        localStorage.setItem('vomit_bg', base64);
      };
      reader.readAsDataURL(file);
    });

    boardBgInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (event) => {
        const base64 = event.target.result;
        appContainer.style.backgroundImage = `url(${base64})`;
        localStorage.setItem('vomit_board_bg', base64);
      };
      reader.readAsDataURL(file);
    });

    const savedBg = localStorage.getItem('vomit_bg');
    if (savedBg) document.body.style.backgroundImage = `url(${savedBg})`;

    const savedBoardBg = localStorage.getItem('vomit_board_bg');
    if (savedBoardBg) appContainer.style.backgroundImage = `url(${savedBoardBg})`;

    function applyTheme() {
      document.documentElement.style.setProperty('--accent', accentColor.value);
      document.documentElement.style.setProperty('--bg-card', bgCard.value);
      document.documentElement.style.setProperty('--text-main', textMain.value);
      document.documentElement.style.setProperty('--radius', radiusRange.value + 'px');
      document.documentElement.style.setProperty('--board-opacity', opacityRange.value); 
    }
    
    const savedTheme = localStorage.getItem('vomit_theme');
    if (savedTheme) {
      const t = JSON.parse(savedTheme);
      accentColor.value = t.accent; 
      bgCard.value = t.bgCard; 
      textMain.value = t.textMain; 
      radiusRange.value = t.radius;
      if (t.opacity) opacityRange.value = t.opacity;
      applyTheme();
    }

    [accentColor, bgCard, textMain, radiusRange, opacityRange].forEach(el => {
      el.addEventListener('input', () => {
        applyTheme();
        localStorage.setItem('vomit_theme', JSON.stringify({
          accent: accentColor.value, 
          bgCard: bgCard.value, 
          textMain: textMain.value, 
          radius: radiusRange.value,
          opacity: opacityRange.value
        }));
      });
    });

    document.getElementById('resetSettings').addEventListener('click', () => {
      localStorage.removeItem('vomit_theme');
      localStorage.removeItem('vomit_bg');
      localStorage.removeItem('vomit_board_bg');
      location.reload();
    });

    loadBoards();
    loadPosts();
    subscribeToRealtime();
  </script>
</body>
</html>
